<div class="modal-backdrop" *ngIf="isOpen()" (click)="onClose()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    
    <!-- Top Decorative Gradient Accent -->
    <div class="modal-accent-bar"></div>

    <!-- Header & Security Shield Icon -->
    <div class="modal-header">
      <div class="badge-icon-container">
        <div class="icon-pulse-ring"></div>
        <div class="icon-circle">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="M12 8v4"></path>
            <path d="M12 16h.01"></path>
          </svg>
        </div>
      </div>
      
      <button type="button" class="close-btn" (click)="onClose()" title="Close Notification" aria-label="Close dialog">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Modal Body Content -->
    <div class="modal-body">
      <div class="policy-badge">
        <span class="policy-dot"></span>
        <span>ACCESS RESTRICTED</span>
      </div>

      <h2 class="modal-title">{{ config().title }}</h2>
      
      <p class="modal-message">
        {{ config().message }}
      </p>


      <!-- Security Meta Details -->
      <div class="security-meta-list">
        <div class="security-meta-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Your session has been securely invalidated for role policy compliance.</span>
        </div>
        <div class="security-meta-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span>Please log in with an authorized account having required permissions.</span>
        </div>
      </div>
    </div>

    <!-- Modal Footer Actions -->
    <div class="modal-footer">
      <button type="button" class="btn-primary" (click)="onAcknowledge()">
        <span>OK, Proceed to Login</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>

  </div>
</div>
