<div class="modal-overlay">
  <div class="modal-content modal-lg">
    <div class="modal-header">
      <h2>Add WhatsApp Campaign</h2>
      <button type="button" class="btn-close" (click)="onClose()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="modal-body">
      <form (ngSubmit)="onSubmit()" #campaignForm="ngForm">
        <div class="form-grid">
          <div class="form-group" style="grid-column: span 2;" *ngIf="isManager">
            <label>Branch *</label>
            <select name="branch" [(ngModel)]="formBranch" required class="form-control" (change)="onBranchChange()">
              <option value="">Select Branch</option>
              <option *ngFor="let b of branches()" [value]="b.id">{{ b.name }}</option>
            </select>
          </div>
          <div class="form-group" style="grid-column: span 2;" *ngIf="formBranch">
            <div *ngIf="formAccount" class="alert-success" style="background: var(--role-tc-bg); color: var(--role-tc-color); padding: 12px; border-radius: 6px; display: flex; align-items: center; border: 1px solid var(--role-tc-border);">
              <span class="material-symbols-outlined" style="font-size: 18px; margin-right: 8px;">check_circle</span>
              <span>Mapped Account: <strong>{{ getMappedAccountName() }}</strong></span>
            </div>
            <div *ngIf="!formAccount" class="alert-error" style="background: var(--role-admin-bg); color: var(--role-admin-color); padding: 12px; border-radius: 6px; display: flex; align-items: center; border: 1px solid var(--role-admin-border);">
              <span class="material-symbols-outlined" style="font-size: 18px; margin-right: 8px;">error</span>
              <span>No active WhatsApp account mapped for this branch! Please map one first.</span>
            </div>
          </div>

          <div class="form-group" [ngStyle]="{'grid-column': campaignToEdit?.id ? 'span 1' : 'span 2'}">
            <label>Campaign Name *</label>
            <input type="text" name="campaignName" [(ngModel)]="formCampaignName" required class="form-control">
          </div>
          
          <div class="form-group flex-center-v" *ngIf="campaignToEdit?.id">
            <label class="checkbox-label">
              <input type="checkbox" name="isActive" [(ngModel)]="formIsActive">
              Is Active
            </label>
          </div>
        </div>
        
        <div class="modal-footer">
          <button type="button" class="btn-cancel" (click)="onClose()" [disabled]="isSubmitting()">Cancel</button>
          <button type="submit" class="btn-save d-flex align-items-center justify-content-center" [disabled]="!campaignForm.valid || isSubmitting() || !formAccount">
            <div *ngIf="isSubmitting()" class="btn-spinner" style="border-width: 2px; width: 14px; height: 14px; margin-right: 6px; display: inline-block;"></div>
            {{ isSubmitting() ? 'Saving...' : 'Save Campaign' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
